# GitLab CI 通用模板：按栈替换 image/script。

stages:
  - verify
  - security
  - build

variables:
  NODE_VERSION: "22"

verify:
  stage: verify
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/

security:
  stage: security
  image: node:${NODE_VERSION}-alpine
  script:
    - npm audit --audit-level=high
  allow_failure: false

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" -f deploy/Dockerfile .
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
